<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packages — Holidae</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<section class="login-page">

  <div class="container">

    <div class="login-card reveal">

      <p class="section-subtitle">
        Join Holidae
      </p>

      <h1 class="login-title">
        Create Your <span>Account</span>
      </h1>

      <p class="login-text">
        Sign up and start planning your next luxury journey with Holidae.
      </p>

      <form id="signupForm" class="login-form">

        
        <div class="form-group">

          <label for="signupName">
            Full Name
          </label>

          <input
            type="text"
            id="signupName"
            placeholder="Your full name"
          />

          <p class="form-error" id="signupNameError"></p>

        </div>

        <div class="form-group">

          <label for="signupEmail">
            Email Address
          </label>

          <input
            type="email"
            id="signupEmail"
            placeholder="your@email.com"
          />

          <p class="form-error" id="signupEmailError"></p>

        </div>

    
        <div class="form-group">

          <label for="signupPassword">
            Password
          </label>

          <input
            type="password"
            id="signupPassword"
            placeholder="Create password"
          />

          <p class="form-error" id="signupPasswordError"></p>

        </div>

      
        <button type="submit" class="btn-primary login-btn">
          Create Account
        </button>

      </form>

      <div class="login-footer">

        <p>
          Already have an account?
        </p>

        <a href="index.html">
         Back Home
        </a>

      </div>

    </div>

  </div>
  <script src="script.js"></script>

</section>
